githubConfigUrl: "https://github.com/user/repo"        # scoped to a single repository
githubConfigSecret: my-repo-github-secret               # k8s secret name with github_token key (needs repo scope)

runnerScaleSetName: "my-repo-runner"                    # used as runs-on: label in workflows

minRunners: 0
maxRunners: 15

# containerMode.type: "dind" intentionally NOT set — the chart would auto-append
# its own dind init-container on top of ours. We replicate the full DinD setup
# manually below so we can add --registry-mirror.
#
# Spanish ISPs periodically block Cloudflare IP ranges during LaLiga matches,
# which kills docker pulls for images whose blobs live on Cloudflare R2 (e.g.
# postgres:17 from Docker Hub). mirror.gcr.io serves the same Docker Hub content
# from Google's CDN, so the mirror arg routes blob fetches around the CF block.

template:
  spec:
    initContainers:
      # Refuse to start the pod if btrfs metadata is critically full. Prevents
      # the "spawn 15 pods, all write to the snapshotter, crash the node"
      # stampede (see CLAUDE.md gotcha #14). Reads sysfs directly so no
      # btrfs tooling is required in the container.
      - name: check-btrfs-metadata
        image: custom-arc-runner:0.6.1  # managed by build.sh — see VERSION file
        imagePullPolicy: Never
        command:
          - sh
          - -c
          - |
            set -eu
            threshold=95
            for fs in /host-sys/fs/btrfs/*/; do
              [ -d "$fs/allocation/metadata" ] || continue
              total=$(cat "$fs/allocation/metadata/total_bytes")
              used=$(cat "$fs/allocation/metadata/bytes_used")
              pct=$(( used * 100 / total ))
              echo "btrfs $(basename $fs) metadata: ${pct}% (${used}/${total} bytes)"
              if [ "$pct" -ge "$threshold" ]; then
                echo "ERROR: metadata at ${pct}% (>=${threshold}%) — refusing to start"
                echo "Run on host: sudo btrfs balance start -dusage=10 -musage=50 /"
                exit 1
              fi
            done
        volumeMounts:
          - name: host-sys-fs-btrfs
            mountPath: /host-sys/fs/btrfs
            readOnly: true
      - name: init-dind-externals
        image: custom-arc-runner:0.6.1  # managed by build.sh — see VERSION file
        imagePullPolicy: Never
        command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --registry-mirror=https://mirror.gcr.io
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command: ["docker", "info"]
          failureThreshold: 24
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
      # Regular init container — runs after the dind sidecar's startupProbe
      # succeeds. Loads prebaked image tars (shipped in the runner image at
      # /opt/preloaded-images/) into DinD's image store so workflows that
      # reference them skip the network pull. See CLAUDE.md gotcha #13.
      - name: preload-images
        image: custom-arc-runner:0.6.1  # managed by build.sh — see VERSION file
        imagePullPolicy: Never
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
        command:
          - sh
          - -c
          - |
            set -e
            shopt -s nullglob 2>/dev/null || true
            for tar in /opt/preloaded-images/*.tar; do
              echo "Loading $tar into DinD..."
              docker load -i "$tar"
            done
        volumeMounts:
          - name: dind-sock
            mountPath: /var/run
    containers:
      - name: runner
        image: custom-arc-runner:0.6.1  # managed by build.sh — see VERSION file
        imagePullPolicy: Never
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          - name: CUSTOM_ACTIONS_RESULTS_URL
            value: "http://cache-server.arc-cache.svc.cluster.local:3000/"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
        resources:
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 8Gi
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: host-sys-fs-btrfs
        hostPath:
          path: /sys/fs/btrfs
          type: Directory
